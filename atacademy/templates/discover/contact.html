{% extends "base.html" %}
{% load static %}

{% block title %}Contact Us{% endblock %}

{% block content %}
<section class="py-10 bg-[#F9FAFB]">
  <div class="main_container">
    <nav class="text-sm text-gray-400 mb-6">
      <a href="{% url 'home' %}" class="hover:text-[#00D4FF]">Home</a> &raquo;
      <span class="text-gray-900">Contact Us</span>
    </nav>
    <div class="bg-[#111827] rounded-xl shadow-2xl p-6 md:p-8 border border-white/10">
      <h1 class="text-2xl xl:text-3xl font-medium mb-6 text-white">Contact <span class="relative inline-block text-[#00D4FF]">Us<svg class="absolute left-0 -bottom-2 w-full h-[14px]" viewBox="0 0 100 12" preserveAspectRatio="none"><path d="M2 10 Q50 0 98 10" stroke="#374151" stroke-width="2" fill="transparent" stroke-linecap="round"></path></svg></span></h1>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="space-y-4">
          <div class="flex items-start gap-3">
            <svg class="w-5 h-5 text-[#00D4FF] mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
            <div><p class="font-semibold text-white">Phone</p><a href="tel:{{ settings.phone }}" class="text-[#00D4FF] hover:underline">{{ settings.phone }}</a></div>
          </div>
          <div class="flex items-start gap-3">
            <svg class="w-5 h-5 text-[#00D4FF] mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            <div><p class="font-semibold text-white">Email</p><a href="mailto:{{ settings.email }}" class="text-[#00D4FF] hover:underline">{{ settings.email }}</a></div>
          </div>
          <div class="flex items-start gap-3">
            <svg class="w-5 h-5 text-[#00D4FF] mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <div><p class="font-semibold text-white">Address</p><p class="text-gray-400">{{ settings.address }}</p></div>
          </div>
        </div>
        <div>
          <button onclick="openEnquiryModal()" class="w-full bg-[#00D4FF] text-gray-900 py-3 rounded-md font-semibold hover:bg-[#00B8E6] transition-colors mb-3 btn-3d">Enquire Now</button>
          <button onclick="openCallbackModal()" class="w-full border border-[#00D4FF] text-[#00D4FF] py-3 rounded-md font-semibold hover:bg-[#00D4FF] hover:text-gray-900 transition-colors btn-3d-outline">Request Callback</button>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
