{% extends "base.html" %}
{% block title %}Gallery{% endblock %}
{% block content %}
<section class="py-10 bg-white">
  <div class="main_container">
    <nav class="text-sm text-gray-500 mb-6"><a href="{% url 'home' %}" class="hover:text-[#2a619d]">Home</a> &raquo; <span class="text-[#162f51]">Gallery</span></nav>
    <h1 class="text-2xl xl:text-3xl font-medium text-center mb-8">Our <span class="relative inline-block text-[#2a619d]">Gallery<svg class="absolute left-0 top-full mt-1 w-full h-[10px]" viewBox="0 0 100 10" preserveAspectRatio="none"><path d="M0 8 Q50 0 100 8" stroke="orangered" stroke-width="1.5" fill="transparent"></path></svg></span></h1>
    {% if gallery_images %}
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        {% for img in gallery_images %}
          <div class="rounded-xl overflow-hidden shadow-[0_4px_14px_rgba(0,0,0,0.08)] hover:shadow-lg transition-shadow">
            {% if img.get_image_url %}<img src="{{ img.get_image_url }}" alt="{{ img.title }}" class="w-full h-48 object-cover">{% endif %}
            <div class="p-2 bg-white"><p class="text-sm font-medium text-[#162f51] truncate">{{ img.title }}</p></div>
          </div>
        {% endfor %}
      </div>
    {% else %}<div class="text-center py-12 text-gray-500">Gallery coming soon.</div>{% endif %}
  </div>
</section>
{% endblock %}
