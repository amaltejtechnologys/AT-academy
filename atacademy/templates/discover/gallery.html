{% extends "base.html" %}
{% block title %}Gallery{% endblock %}
{% block content %}
<section class="py-10 bg-[#0A1A3A]">
  <div class="main_container">
    <nav class="text-sm text-gray-400 mb-6"><a href="{% url 'home' %}" class="hover:text-[#00A3E0]">Home</a> &raquo; <span class="text-white">Gallery</span></nav>
    <h1 class="text-2xl xl:text-3xl font-medium text-center mb-8 text-white">Our <span class="relative inline-block text-[#00A3E0]">Gallery<svg class="absolute left-0 top-full mt-1 w-full h-[10px]" viewBox="0 0 100 10" preserveAspectRatio="none"><path d="M0 8 Q50 0 100 8" stroke="orangered" stroke-width="1.5" fill="transparent"></path></svg></span></h1>
    {% if gallery_images %}
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 perspective-container">
        {% for img in gallery_images %}
          <div class="rounded-xl overflow-hidden shadow-[0_4px_14px_rgba(0,0,0,0.3)] card-3d glow-border">
            {% if img.get_image_url %}<img src="{{ img.get_image_url }}" alt="{{ img.title }}" class="w-full h-48 object-cover">{% endif %}
            <div class="p-2 bg-[#122448] border-t border-white/10"><p class="text-sm font-medium text-white truncate">{{ img.title }}</p></div>
          </div>
        {% endfor %}
      </div>
    {% else %}<div class="text-center py-12 text-gray-400">Gallery coming soon.</div>{% endif %}
  </div>
</section>
{% endblock %}
