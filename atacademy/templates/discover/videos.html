{% extends "base.html" %}
{% block title %}Videos{% endblock %}
{% block content %}
<section class="py-10 bg-[#0A1A3A]">
  <div class="main_container">
    <nav class="text-sm text-gray-400 mb-6"><a href="{% url 'home' %}" class="hover:text-[#00A3E0]">Home</a> &raquo; <span class="text-white">Videos</span></nav>
    <h1 class="text-2xl xl:text-3xl font-medium text-center mb-8 text-white">Our <span class="relative inline-block text-[#00A3E0]">Videos<svg class="absolute left-0 top-full mt-1 w-full h-[10px]" viewBox="0 0 100 10" preserveAspectRatio="none"><path d="M0 8 Q50 0 100 8" stroke="orangered" stroke-width="1.5" fill="transparent"></path></svg></span></h1>
    {% if settings.videos_url %}
      <div class="max-w-3xl mx-auto">
        <iframe src="{{ settings.videos_url }}" class="w-full aspect-video rounded-xl shadow-lg border border-white/10" frameborder="0" allowfullscreen></iframe>
      </div>
    {% else %}<div class="text-center py-12 text-gray-400">Videos coming soon.</div>{% endif %}
  </div>
</section>
{% endblock %}
