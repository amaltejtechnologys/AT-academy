{% extends "base.html" %}
{% block title %}Apply for Jobs{% endblock %}
{% block content %}
<section class="py-10 bg-[#F9FAFB]">
  <div class="main_container">
    <nav class="text-sm text-gray-400 mb-6"><a href="{% url 'home' %}" class="hover:text-[#00D4FF]">Home</a> &raquo; <span class="text-gray-900">Apply for Jobs</span></nav>
    <div class="bg-[#FFFFFF] rounded-xl shadow-[0_4px_14px_rgba(0,0,0,0.3)] p-6 md:p-8 border border-gray-200">
      <h1 class="text-2xl xl:text-3xl font-medium mb-4 text-gray-900">Apply for <span class="relative inline-block text-[#00D4FF]">Jobs<svg class="absolute left-0 -bottom-2 w-full h-[14px]" viewBox="0 0 100 12" preserveAspectRatio="none"><path d="M2 10 Q50 0 98 10" stroke="#374151" stroke-width="2" fill="transparent" stroke-linecap="round"></path></svg></span></h1>
      <p class="text-gray-600 mb-6">Ready to take the next step? Contact us and we'll help you find the right opportunity.</p>
      <button onclick="openCallbackModal()" class="w-full bg-[#00D4FF] text-gray-900 py-3 rounded-md font-semibold hover:bg-[#00B8E6] transition-colors mb-3 btn-3d">Request Callback</button>
      <a href="tel:{{ settings.phone }}" class="block w-full border border-[#00D4FF] text-[#00D4FF] py-3 rounded-md font-semibold hover:bg-[#00D4FF] hover:text-gray-900 transition-colors text-center btn-3d-outline">Call Us: {{ settings.phone }}</a>
    </div>
  </div>
</section>
{% endblock %}
