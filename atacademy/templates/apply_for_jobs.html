{% extends "base.html" %}
{% block title %}Apply for Jobs{% endblock %}
{% block content %}
<section class="py-10 bg-white">
  <div class="main_container">
    <nav class="text-sm text-gray-500 mb-6"><a href="{% url 'home' %}" class="hover:text-[#2a619d]">Home</a> &raquo; <span class="text-[#162f51]">Apply for Jobs</span></nav>
    <div class="bg-white rounded-xl shadow-[0_4px_14px_rgba(0,0,0,0.08)] p-6 md:p-8">
      <h1 class="text-2xl xl:text-3xl font-medium mb-4">Apply for <span class="relative inline-block text-[#2a619d]">Jobs<svg class="absolute left-0 -bottom-2 w-full h-[14px]" viewBox="0 0 100 12" preserveAspectRatio="none"><path d="M2 10 Q50 0 98 10" stroke="orangered" stroke-width="2" fill="transparent" stroke-linecap="round"></path></svg></span></h1>
      <p class="text-gray-600 mb-6">Ready to take the next step? Contact us and we'll help you find the right opportunity.</p>
      <button onclick="openCallbackModal()" class="w-full bg-[#2a619d] text-white py-3 rounded-md font-semibold hover:bg-[#214d7d] transition-colors mb-3">Request Callback</button>
      <a href="tel:{{ settings.phone }}" class="block w-full border border-[#2a619d] text-[#2a619d] py-3 rounded-md font-semibold hover:bg-[#2a619d] hover:text-white transition-colors text-center">Call Us: {{ settings.phone }}</a>
    </div>
  </div>
</section>
{% endblock %}
