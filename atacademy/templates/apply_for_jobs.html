{% extends "base.html" %}
{% block title %}Apply for Jobs{% endblock %}
{% block content %}
<section class="py-10 bg-[#0A1A3A]">
  <div class="main_container">
    <nav class="text-sm text-gray-400 mb-6"><a href="{% url 'home' %}" class="hover:text-[#00A3E0]">Home</a> &raquo; <span class="text-white">Apply for Jobs</span></nav>
    <div class="bg-[#122448] rounded-xl shadow-[0_4px_14px_rgba(0,0,0,0.3)] p-6 md:p-8 border border-white/10">
      <h1 class="text-2xl xl:text-3xl font-medium mb-4 text-white">Apply for <span class="relative inline-block text-[#00A3E0]">Jobs<svg class="absolute left-0 -bottom-2 w-full h-[14px]" viewBox="0 0 100 12" preserveAspectRatio="none"><path d="M2 10 Q50 0 98 10" stroke="orangered" stroke-width="2" fill="transparent" stroke-linecap="round"></path></svg></span></h1>
      <p class="text-gray-300 mb-6">Ready to take the next step? Contact us and we'll help you find the right opportunity.</p>
      <button onclick="openCallbackModal()" class="w-full bg-[#00A3E0] text-white py-3 rounded-md font-semibold hover:bg-[#0085BD] transition-colors mb-3 btn-3d">Request Callback</button>
      <a href="tel:{{ settings.phone }}" class="block w-full border border-[#00A3E0] text-[#00A3E0] py-3 rounded-md font-semibold hover:bg-[#00A3E0] hover:text-white transition-colors text-center btn-3d-outline">Call Us: {{ settings.phone }}</a>
    </div>
  </div>
</section>
{% endblock %}
